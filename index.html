<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bijak Sifir ✨</title>
<style>
  :root {
    --pink:   #FF6B9D;
    --teal:   #00C9A7;
    --purple: #A78BFA;
    --orange: #F97316;
    --navy:   #1E3A5F;
    --sky:    #0EA5E9;
    --red:    #EF4444;
    --green:  #16A34A;
    --amber:  #F59E0B;
    --slate:  #64748B;
    --violet: #7C3AED;
    --bg:     #F0F4FF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  #app {
    background: white;
    border-radius: 20px;
    width: 500px;
    min-height: 560px;
    max-height: 560px;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    position: relative;
  }

  /* ── Scrollbar ── */
  #app::-webkit-scrollbar { width: 6px; }
  #app::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
  #app::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 10px; }

  /* ── Screen sections ── */
  .screen { padding: 18px 20px; }

  /* ── Header ── */
  .game-title {
    font-size: 26px;
    font-weight: 900;
    text-align: center;
    background: linear-gradient(90deg, var(--violet), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    font-size: 12px;
    color: var(--slate);
    margin-bottom: 14px;
  }

  /* ── Tab Buttons ── */
  .tab-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
  }

  .tab-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .tab-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .tab-btn.solo  { background: #CCE5FF; color: #1E3A5F; }
  .tab-btn.multi { background: #D4EDDA; color: #1A6B37; }

  /* ── Menu buttons ── */
  .menu-btn-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
  }

  .menu-btn {
    width: 200px;
    padding: 9px 0;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.15); }

  /* ── Form inputs ── */
  label.field-lbl {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--slate);
    margin-bottom: 4px;
  }

  input[type=text], input[type=number] {
    width: 100%;
    padding: 9px 12px;
    border: 2px solid #E2E8F0;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    margin-bottom: 10px;
  }
  input:focus { border-color: var(--violet); }

  /* ── Section buttons (Bahagian) ── */
  .section-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 10px 0;
  }

  .section-btn {
    padding: 12px 6px;
    border: none;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1.4;
    transition: transform .15s, box-shadow .15s;
  }
  .section-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
  .section-btn.b1 { background: #FFB6C1; color: #6B1A2B; }
  .section-btn.b2 { background: #B6D7FF; color: #1A3B6B; }
  .section-btn.b3 { background: #FFFACD; color: #5C4A00; }

  /* ── Info box ── */
  .info-box {
    background: #FFF9E6;
    border: 1.5px solid #FCD34D;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    color: #78350F;
    text-align: center;
    margin: 10px 0;
  }

  /* ── Checkbox toggle ── */
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #333;
    margin-bottom: 8px;
  }

  .toggle-row input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }

  /* ── Back button ── */
  .back-btn {
    display: inline-block;
    margin-top: 10px;
    background: #E2E8F0;
    border: none;
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 12px;
    cursor: pointer;
    color: #333;
    font-weight: 600;
  }
  .back-btn:hover { background: #CBD5E1; }

  /* ════════════════════════════════ GAME UI ═ */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid #F1F5F9;
    background: #FAFAFA;
    border-radius: 20px 20px 0 0;
  }

  .top-bar .player-tag {
    font-size: 13px;
    font-weight: 700;
    color: var(--pink);
  }

  .top-bar .icon-btns { display: flex; gap: 6px; }
  .icon-btn {
    padding: 4px 10px;
    border: none;
    border-radius: 7px;
    font-size: 11px;
    cursor: pointer;
    font-weight: 600;
  }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: #F8F0FF;
    font-size: 12px;
  }

  .lives { color: var(--red); font-size: 14px; }
  .combo { color: var(--amber); font-weight: 700; }
  .level-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    color: var(--navy);
  }

  .section-label {
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    color: var(--purple);
    padding: 8px 14px 0;
  }

  .question-counter {
    text-align: center;
    font-size: 12px;
    color: var(--orange);
    padding: 2px 0;
  }

  .question-text {
    text-align: center;
    font-size: 16px;
    font-weight: 800;
    color: var(--navy);
    padding: 10px 20px;
    min-height: 56px;
    line-height: 1.4;
  }

  /* ── Answer buttons ── */
  .answer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 6px 14px 10px;
  }

  .ans-btn {
    padding: 14px 8px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    color: white;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s, opacity .2s;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
  }
  .ans-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 7px 18px rgba(0,0,0,.2); }
  .ans-btn:disabled { opacity: .75; cursor: default; }
  .ans-btn.correct { background: #22C55E !important; }
  .ans-btn.wrong   { background: #EF4444 !important; }

  .ans-btn.c0 { background: linear-gradient(135deg, #FF6B6B, #FF4444); }
  .ans-btn.c1 { background: linear-gradient(135deg, #4ECDC4, #2EA89E); }
  .ans-btn.c2 { background: linear-gradient(135deg, #45B7D1, #2196B6); }
  .ans-btn.c3 { background: linear-gradient(135deg, #FFA07A, #FF7043); }

  /* ── Footer ── */
  .game-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px 12px;
  }

  .timer-display {
    font-size: 14px;
    font-weight: 800;
    color: var(--sky);
  }
  .timer-display.warn { color: var(--red); }

  .status-msg {
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    flex: 1;
    padding: 0 8px;
  }
  .status-msg.ok   { color: var(--green); }
  .status-msg.fail { color: var(--red); }

  .score-display {
    font-size: 14px;
    font-weight: 800;
    color: var(--teal);
  }

  /* ── Timer bar ── */
  .timer-bar-wrap {
    padding: 0 14px 4px;
  }
  .timer-bar-bg {
    height: 5px;
    background: #E2E8F0;
    border-radius: 4px;
    overflow: hidden;
  }
  .timer-bar-fill {
    height: 100%;
    background: var(--sky);
    border-radius: 4px;
    transition: width .1s linear, background .3s;
  }
  .timer-bar-fill.warn { background: var(--red); }

  /* ════════════════════════════════ MULTIPLAYER ═ */
  .mp-layout {
    display: flex;
    flex: 1;
  }

  .mp-left { flex: 1; }

  .live-skor-panel {
    width: 148px;
    background: #F0F4FF;
    border-left: 2px solid #E2E8F0;
    padding: 0 6px 8px;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .live-skor-panel h4 {
    background: var(--violet);
    color: white;
    font-size: 11px;
    padding: 5px 8px;
    margin: 0 -6px 8px;
    text-align: center;
  }

  .skor-row {
    border-radius: 8px;
    padding: 5px 7px;
    margin-bottom: 5px;
    font-size: 11px;
  }
  .skor-row.active { border: 2px solid var(--violet); }
  .skor-row .player-name { font-weight: 700; color: #111; }
  .skor-row .player-pts  { color: var(--slate); }

  /* ── Turn screen ── */
  .turn-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    text-align: center;
    gap: 10px;
    min-height: 400px;
  }

  .turn-emoji { font-size: 72px; }
  .turn-name  { font-size: 22px; font-weight: 900; color: var(--navy); }
  .turn-info  { font-size: 13px; color: var(--slate); }
  .turn-mini-scores {
    font-size: 11px;
    color: var(--slate);
    background: #F8FAFF;
    border-radius: 8px;
    padding: 6px 12px;
    border: 1px solid #E2E8F0;
    max-width: 300px;
    text-align: center;
  }

  .start-turn-btn {
    padding: 12px 28px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, var(--violet), var(--pink));
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 20px rgba(118, 75, 162, .35);
  }
  .start-turn-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(118,75,162,.4); }

  /* ════════════════════════════════ RESULTS ═ */
  .result-screen { padding: 16px 20px; }

  .result-title {
    text-align: center;
    font-size: 24px;
    font-weight: 900;
    color: var(--navy);
    margin-bottom: 8px;
  }

  .winner-card {
    border-radius: 14px;
    padding: 14px 18px;
    text-align: center;
    margin-bottom: 12px;
  }
  .winner-label { font-size: 14px; font-weight: 800; color: var(--violet); }
  .winner-name  { font-size: 22px; font-weight: 900; color: var(--pink); margin: 4px 0; }
  .winner-score { font-size: 15px; font-weight: 700; color: var(--teal); }

  .rank-list { margin-bottom: 12px; }
  .rank-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 12px;
    border-radius: 10px;
    margin-bottom: 5px;
    font-size: 13px;
  }
  .rank-item .rank-name { font-weight: 700; }
  .rank-item .rank-pts  { font-size: 12px; color: var(--slate); }

  /* ── Badge summary ── */
  .badge-box {
    background: #F3E8FF;
    border: 1.5px solid #C4B5FD;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .badge-box h4 { font-size: 13px; font-weight: 800; color: var(--violet); margin-bottom: 6px; }
  .badge-item { font-size: 12px; color: #6D28D9; margin-bottom: 3px; }

  /* ── Action buttons row ── */
  .action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
  }

  .action-btn {
    padding: 9px 18px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .action-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,.15); }

  /* ── Game over ── */
  .gameover-screen {
    padding: 30px 20px;
    text-align: center;
  }
  .gameover-title { font-size: 30px; font-weight: 900; color: var(--red); margin-bottom: 6px; }
  .gameover-sub   { font-size: 14px; color: var(--slate); margin-bottom: 12px; }

  /* ── Multiplayer player rows ── */
  .player-entry-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
  }
  .player-entry-row label { font-size: 13px; width: 90px; flex-shrink: 0; }
  .player-entry-row input { margin: 0; flex: 1; }

  .counter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .counter-row label { font-size: 13px; color: var(--slate); }
  .count-val { font-size: 18px; font-weight: 900; color: var(--navy); min-width: 28px; text-align: center; }
  .count-btn {
    padding: 4px 10px;
    border: none;
    border-radius: 7px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 700;
  }

  /* ── Leaderboard popup ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-box {
    background: white;
    border-radius: 16px;
    width: 460px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal-box h3 { font-size: 17px; font-weight: 900; color: var(--navy); margin-bottom: 12px; text-align: center; }
  .modal-close {
    display: block;
    margin: 12px auto 0;
    padding: 7px 20px;
    border: none;
    border-radius: 8px;
    background: #E2E8F0;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
  }

  /* ── Progress bar ── */
  .progress-wrap { padding: 0 14px 2px; }
  .progress-bg {
    height: 5px;
    background: #E2E8F0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 2px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--violet), var(--pink));
    border-radius: 4px;
    transition: width .3s ease;
  }

  /* ── Level popup ── */
  .level-toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    border-radius: 14px;
    padding: 18px 28px;
    font-size: 17px;
    font-weight: 900;
    color: var(--violet);
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    z-index: 50;
    text-align: center;
    animation: popIn .3s ease;
  }
  @keyframes popIn {
    from { transform: translate(-50%,-50%) scale(.8); opacity: 0; }
    to   { transform: translate(-50%,-50%) scale(1);  opacity: 1; }
  }

  /* ── Divider ── */
  .divider { border: none; border-top: 1px solid #F1F5F9; margin: 8px 0; }

  /* ── Records table ── */
  .record-item {
    padding: 6px 0;
    border-bottom: 1px solid #F1F5F9;
    font-size: 12px;
  }
  .record-item .rq { font-weight: 600; color: var(--navy); }
  .record-item .rm { color: var(--slate); }
  .record-item .rok  { color: var(--green); }
  .record-item .rfail { color: var(--red); }

</style>
</head>
<body>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const EMOJI_POOL = ["🦁","🐯","🐻","🦊","🐼","🐸","🦄","🐲","🦋","🐬","🦅","🐺","🦖","🐙","🦩","🐧"];
const BTN_COLORS = ["c0","c1","c2","c3"];

const BADGE_LIST = {
  "Sifir Master":  { desc:"Dapat skor penuh di Bahagian 1",       icon:"🌟" },
  "Unit Champion": { desc:"Dapat skor penuh di Bahagian 2",       icon:"📏" },
  "Problem Solver":{ desc:"Dapat skor penuh di Bahagian 3",       icon:"🧠" },
  "Perfect Score": { desc:"Jawab semua soalan betul!",            icon:"💯" },
  "Speed Genius":  { desc:"Purata masa jawapan < 5 saat",         icon:"⚡" },
  "Combo King":    { desc:"5 jawapan betul berturut-turut",       icon:"🔥" },
  "Survivor":      { desc:"Habiskan permainan tanpa hilang nyawa",icon:"❤️" },
  "Level Master":  { desc:"Capai Level 3",                        icon:"🚀" },
  "Quick Thinker": { desc:"Jawab soalan dalam masa < 3 saat",     icon:"💨" },
};

const LEVEL_CONFIG = {
  1:{ nama:"Mudah",    masaLimit:30, bonusCombo:1, color:"#90EE90" },
  2:{ nama:"Sederhana",masaLimit:20, bonusCombo:2, color:"#FFD700" },
  3:{ nama:"Susah",    masaLimit:12, bonusCombo:3, color:"#FF6B6B" },
};

const PLAYER_BG     = ["#FFE4E1","#E1F5FE","#E8F5E9","#FFF9C4"];
const PLAYER_BORDER = ["#FF6B6B","#4ECDC4","#66BB6A","#FFC107"];

const LEVEL_UP   = 4;
const LEVEL_DOWN = 3;
const SOALAN_MAX = 10;

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let G = {};

function resetSoloState(bahagian, nama) {
  G = {
    mode: "solo",
    nama, bahagian,
    skor: 0,
    soalanKe: 0,
    nyawa: 3,
    combo: 0,
    wrongStreak: 0,
    level: 1,
    badges: [],
    rekod: [],
    modeExam: G.modeExam || false,
    currentAnswer: 0,
    masaMula: 0,
    timerID: null,
    // multiplayer
    pemain: [],
    pemainIdx: 0,
  };
}

function getEmojiForName(nama) {
  let s = 0;
  for (const c of nama) s += c.charCodeAt(0);
  return EMOJI_POOL[s % EMOJI_POOL.length];
}

// ═══════════════════════════════════════════════
// LEADERBOARD (localStorage)
// ═══════════════════════════════════════════════
function saveLeaderboard(entries) {
  const existing = loadLeaderboard();
  const merged = [...existing, ...entries];
  merged.sort((a,b) => b.skor - a.skor);
  localStorage.setItem("bijak_sifir_lb", JSON.stringify(merged.slice(0,50)));
}

function loadLeaderboard() {
  try { return JSON.parse(localStorage.getItem("bijak_sifir_lb")) || []; }
  catch { return []; }
}

// ═══════════════════════════════════════════════
// SOALAN GENERATORS
// ═══════════════════════════════════════════════
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }

function getLv() {
  if (G.mode === "multi") return G.pemain[G.pemainIdx].level;
  return G.level;
}

function generateSifir() {
  const lv = getLv();
  let a, b;
  if (lv===1) { a=rand(2,5); b=rand(2,5); }
  else if (lv===2) { a=rand(2,9); b=rand(2,9); }
  else { a=rand(6,12); b=rand(6,12); }
  const jawapan = a * b;
  const choices = shuffle([jawapan, jawapan+rand(1,5), Math.max(1,jawapan-rand(1,5)), jawapan+rand(6,12)]);
  return { teks:`${a} × ${b} = ?`, jawapan, choices };
}

function generateTukarUnit() {
  const lv = getLv();
  let pool;
  if (lv===1) pool=["kg_g","l_ml","jam_min"];
  else if (lv===2) pool=["kg_g","g_kg","l_ml","ml_l","jam_min","min_jam"];
  else pool=["kg_g","g_kg","l_ml","ml_l","jam_min","min_jam","hari_jam","minggu_hari"];
  const jenis = pool[rand(0,pool.length-1)];
  let teks, jawapan;
  if (jenis==="kg_g")     { const v=rand(1,20); teks=`${v} kg = ? g`; jawapan=v*1000; }
  else if (jenis==="g_kg") { const v=[1000,2000,3000,4000,5000,6000,8000,10000][rand(0,7)]; teks=`${v} g = ? kg`; jawapan=v/1000; }
  else if (jenis==="l_ml") { const v=rand(1,20); teks=`${v} L = ? mL`; jawapan=v*1000; }
  else if (jenis==="ml_l") { const v=[1000,2000,3000,4000,5000,6000][rand(0,5)]; teks=`${v} mL = ? L`; jawapan=v/1000; }
  else if (jenis==="jam_min") { const v=rand(1,10); teks=`${v} jam = ? minit`; jawapan=v*60; }
  else if (jenis==="min_jam") { const v=[60,120,180,240,300][rand(0,4)]; teks=`${v} minit = ? jam`; jawapan=v/60; }
  else if (jenis==="hari_jam") { const v=rand(1,7); teks=`${v} hari = ? jam`; jawapan=v*24; }
  else { const v=rand(1,4); teks=`${v} minggu = ? hari`; jawapan=v*7; }
  let choices=[jawapan];
  while (choices.length<4) {
    const d=jawapan<10?rand(1,2):(jawapan<100?[5,10,15][rand(0,2)]:[10,50,100][rand(0,2)]);
    const p=jawapan+([1,-1][rand(0,1)]*d);
    if (!choices.includes(p) && p>0) choices.push(p);
  }
  return { teks, jawapan, choices:shuffle(choices) };
}

function generateMasalah() {
  const lv = getLv();
  const mudah=[
    {teks:"Alia ada 2 gulung riben: 32 cm dan 57 cm. Jumlah panjang dalam mm?",jawapan:890,salah:[880,900,89]},
    {teks:"Kek dipotong 8 bahagian. Aina makan 3/8, adiknya 2/8. Berapa bahagian tinggal?",jawapan:3,salah:[5,2,4]},
  ];
  const sederhana=[
    {teks:"Mat ada kertas 76 meter. Adik potong 34 meter. Panjang tinggal dalam sentimeter?",jawapan:4200,salah:[42,420,4000]},
    {teks:"Sebiji durian 0.5 kg. Hanafi beli 6 biji. Jumlah berat dalam gram?",jawapan:3000,salah:[3,300,30000]},
    {teks:"Rauf bermain bola 30 minit sehari. Jumlah masa seminggu dalam jam?",jawapan:3.5,salah:[3,4,210]},
  ];
  const susah=[
    {teks:"Sofia dapat cuti 3 hari, kemudian 4 hari lagi. Jumlah hari dalam minggu?",jawapan:1,salah:[7,2,3]},
    {teks:"Haziq bawa 2 liter air. Baki 500 mL. Berapa liter diminum?",jawapan:1.5,salah:[1,2,0.5]},
    {teks:"Bekalan air 6000 L. Guna 250 L sehari. Tahan berapa hari?",jawapan:24,salah:[20,25,30]},
    {teks:"Buku RM5.90 sebiji. Haidhar beli 5 buah. Baki dari RM50?",jawapan:20.5,salah:[20,21,19.5]},
  ];
  const pool = lv===1?mudah:(lv===2?sederhana:susah);
  const s = pool[rand(0,pool.length-1)];
  return { teks:s.teks, jawapan:s.jawapan, choices:shuffle([s.jawapan,...s.salah]) };
}

function janasoalan(bahagian) {
  if (bahagian===1) return generateSifir();
  if (bahagian===2) return generateTukarUnit();
  return generateMasalah();
}

function nextQuestion() {
  clearTimer();
  G.soalanKe++;
  if (G.soalanKe > SOALAN_MAX) {
    if (G.mode==="multi") endTurn();
    else endGame();
    return;
  }

  const { teks, jawapan, choices } = janasoalan(G.bahagian);
  G.currentAnswer = jawapan;

  // Update labels
  document.getElementById("lbl-bahagian").textContent = `Bahagian ${G.bahagian}: ${sectionName(G.bahagian)}`;
  document.getElementById("lbl-soalan-ke").textContent = `Soalan ${G.soalanKe}/${SOALAN_MAX}`;
  document.getElementById("lbl-soalan").textContent = teks;
  document.getElementById("lbl-status").textContent = "";
  document.getElementById("lbl-status").className = "status-msg";

  const p = G.mode==="multi" ? G.pemain[G.pemainIdx] : G;
  document.getElementById("lbl-skor").textContent = `Skor: ${p.skor}`;

  // Progress bar
  const pct = ((G.soalanKe-1)/SOALAN_MAX)*100;
  document.getElementById("progress-fill").style.width = pct+"%";

  // Answer buttons
  choices.forEach((c,i)=>{
    const btn = document.getElementById(`ans-btn-${i}`);
    btn.textContent = c;
    btn.disabled = false;
    btn.className = `ans-btn ${BTN_COLORS[i]}`;
  });

  // Timer
  const lv = G.mode==="multi" ? G.pemain[G.pemainIdx].level : G.level;
  const limit = LEVEL_CONFIG[lv].masaLimit;
  G.masaMula = Date.now();
  startTimer(limit);
}

// ── TIMER ──
function startTimer(limit) {
  const timerLbl  = document.getElementById("lbl-timer");
  const timerBar  = document.getElementById("timer-bar");

  function tick() {
    const elapsed = (Date.now() - G.masaMula) / 1000;
    const remaining = limit - elapsed;
    const pct = Math.max(0, (remaining/limit)*100);

    if (timerLbl) {
      timerLbl.textContent = `⏱ ${elapsed.toFixed(1)}s`;
      timerLbl.className = "timer-display" + (remaining<=5?" warn":"");
    }
    if (timerBar) {
      timerBar.style.width = pct+"%";
      timerBar.className = "timer-bar-fill" + (remaining<=5?" warn":"");
    }

    if (elapsed >= limit) {
      checkAnswer(null, true);
      return;
    }
    G.timerID = requestAnimationFrame(tick);
  }
  G.timerID = requestAnimationFrame(tick);
}

function clearTimer() {
  if (G.timerID) { cancelAnimationFrame(G.timerID); G.timerID = null; }
}

// ── HANDLE ANSWER ──
function handleAnswer(idx) {
  clearTimer();
  const masaDiambil = (Date.now() - G.masaMula) / 1000;
  G.masaDiambil = masaDiambil;
  let val = document.getElementById(`ans-btn-${idx}`).textContent;
  let parsed = val.includes(".") ? parseFloat(val) : parseInt(val);
  checkAnswer(parsed, false);
}

function checkAnswer(userAns, timeout) {
  const jawapan = G.currentAnswer;
  const betul   = !timeout && (parseFloat(userAns) === parseFloat(jawapan));
  const masaDiambil = G.masaDiambil || 0;

  if (G.mode==="multi") checkAnswerMP(userAns, jawapan, betul, masaDiambil, timeout);
  else                  checkAnswerSolo(userAns, jawapan, betul, masaDiambil, timeout);
}

// ── SOLO ──
function checkAnswerSolo(userAns, jawapan, betul, masa, timeout) {
  const statusEl = document.getElementById("lbl-status");

  if (betul) {
    G.combo++; G.wrongStreak=0;
    const bonus = G.combo>=3 ? LEVEL_CONFIG[G.level].bonusCombo : 0;
    G.skor += 1+bonus;
    if (G.combo>=5 && !G.badges.includes("Combo King")) G.badges.push("Combo King");
    if (masa<3.0  && !G.badges.includes("Quick Thinker")) G.badges.push("Quick Thinker");

    let msg = `✔ Betul! +${1+bonus} mata`;
    if (G.combo>=3) msg += ` | 🔥x${G.combo}`;
    if (!G.modeExam) { statusEl.textContent=msg; statusEl.className="status-msg ok"; }

    if (G.combo>0 && G.combo%LEVEL_UP===0 && G.level<3) {
      G.level++;
      showLevelToast(`⬆️ Level Naik! Level ${G.level}`);
    }
  } else {
    G.combo=0; G.wrongStreak++; G.nyawa--;
    let msg = timeout ? "⏰ Masa Habis!" : `❌ Salah! (Betul: ${jawapan})`;
    if (!G.modeExam) { statusEl.textContent=`${msg} | ${nyawaTeks(G.nyawa)}`; statusEl.className="status-msg fail"; }
    if (!G.modeExam) highlightButtons(jawapan);
    if (G.wrongStreak>=LEVEL_DOWN && G.level>1) {
      G.level--; G.wrongStreak=0;
      showLevelToast(`⬇️ Level Turun ke Level ${G.level}`);
    }
  }
  if (!G.modeExam) highlightButtons(jawapan);

  // Update UI labels
  const lbl = document.getElementById("lbl-nyawa");
  const lbc = document.getElementById("lbl-combo");
  const lbl2 = document.getElementById("lbl-level");
  const lbls = document.getElementById("lbl-skor");
  if (lbl) lbl.textContent = nyawaTeks(G.nyawa);
  if (lbc) lbc.textContent = comboTeks(G.combo);
  if (lbl2) {
    const cfg = LEVEL_CONFIG[G.level];
    lbl2.textContent = `📈 L${G.level}: ${cfg.nama}`;
    lbl2.style.background = cfg.color;
  }
  if (lbls) lbls.textContent = `Skor: ${G.skor}`;

  G.rekod.push({ teks:document.getElementById("lbl-soalan").textContent, userAns, jawapan, masa, betul });

  if (G.nyawa<=0) { setTimeout(gameOver, 1400); return; }
  setTimeout(nextQuestion, 1400);
}

// ── MULTIPLAYER ──
function checkAnswerMP(userAns, jawapan, betul, masa, timeout) {
  const p = G.pemain[G.pemainIdx];
  const statusEl = document.getElementById("lbl-status");

  if (betul) {
    p.combo++; p.wrongStreak=0;
    const bonus = p.combo>=3 ? LEVEL_CONFIG[p.level].bonusCombo : 0;
    p.skor += 1+bonus;
    if (p.combo>=5 && !p.badges.includes("Combo King")) p.badges.push("Combo King");
    if (masa<3.0  && !p.badges.includes("Quick Thinker")) p.badges.push("Quick Thinker");
    let msg = `✔ Betul! +${1+bonus} mata`;
    if (p.combo>=3) msg += ` | 🔥x${p.combo}`;
    if (!G.modeExam) { statusEl.textContent=msg; statusEl.className="status-msg ok"; }
    if (p.combo>0 && p.combo%LEVEL_UP===0 && p.level<3) {
      p.level++;
      showLevelToast(`⬆️ ${p.emoji} Level Naik! Level ${p.level}`);
    }
  } else {
    p.combo=0; p.wrongStreak++; p.nyawa--;
    let msg = timeout ? "⏰ Masa Habis!" : `❌ Salah! (Betul: ${jawapan})`;
    if (!G.modeExam) { statusEl.textContent=`${msg} | ${nyawaTeks(p.nyawa)}`; statusEl.className="status-msg fail"; }
    if (!G.modeExam) highlightButtons(jawapan);
    if (p.wrongStreak>=LEVEL_DOWN && p.level>1) {
      p.level--; p.wrongStreak=0;
      showLevelToast(`⬇️ ${p.emoji} Level Turun ke Level ${p.level}`);
    }
  }
  if (!G.modeExam) highlightButtons(jawapan);

  const lbl = document.getElementById("lbl-nyawa");
  const lbc = document.getElementById("lbl-combo");
  const lbl2 = document.getElementById("lbl-level");
  const lbls = document.getElementById("lbl-skor");
  if (lbl) lbl.textContent = nyawaTeks(p.nyawa);
  if (lbc) lbc.textContent = comboTeks(p.combo);
  if (lbl2) {
    const cfg = LEVEL_CONFIG[p.level];
    lbl2.textContent = `📈 L${p.level}: ${cfg.nama}`;
    lbl2.style.background = cfg.color;
  }
  if (lbls) lbls.textContent = `Skor: ${p.skor}`;
  updateLiveSkor();

  p.rekod.push({ teks:document.getElementById("lbl-soalan").textContent, userAns, jawapan, masa, betul });

  if (p.nyawa<=0) { p.gameOver=true; setTimeout(endTurn, 1400); return; }
  setTimeout(nextQuestion, 1400);
}

// ── Highlight ──
function highlightButtons(jawapan) {
  [0,1,2,3].forEach(i=>{
    const btn = document.getElementById(`ans-btn-${i}`);
    if (!btn) return;
    btn.disabled = true;
    const bv = btn.textContent.includes(".")?parseFloat(btn.textContent):parseInt(btn.textContent);
    btn.classList.add(bv==jawapan?"correct":"wrong");
  });
}

// ── Level toast ──
function showLevelToast(msg) {
  const toast = document.createElement("div");
  toast.className = "level-toast";
  toast.textContent = msg;
  app.appendChild(toast);
  setTimeout(()=>toast.remove(), 1800);
}

// ═══════════════════════════════════════════════
// END GAME / END TURN
// ═══════════════════════════════════════════════
function awardBadgesSolo() {
  const { skor, level, nyawa, rekod, bahagian, badges } = G;
  if (skor===SOALAN_MAX) {
    if (bahagian===1 && !badges.includes("Sifir Master")) badges.push("Sifir Master");
    if (bahagian===2 && !badges.includes("Unit Champion")) badges.push("Unit Champion");
    if (bahagian===3 && !badges.includes("Problem Solver")) badges.push("Problem Solver");
    if (!badges.includes("Perfect Score")) badges.push("Perfect Score");
  }
  if (nyawa===3 && !badges.includes("Survivor")) badges.push("Survivor");
  if (level===3 && !badges.includes("Level Master")) badges.push("Level Master");
  if (rekod.length) {
    const avg = rekod.reduce((s,r)=>s+r.masa,0)/rekod.length;
    if (avg<5.0 && !badges.includes("Speed Genius")) badges.push("Speed Genius");
  }
}

function awardBadgesMP(p) {
  if (p.skor===SOALAN_MAX) {
    if (G.bahagian===1 && !p.badges.includes("Sifir Master")) p.badges.push("Sifir Master");
    if (G.bahagian===2 && !p.badges.includes("Unit Champion")) p.badges.push("Unit Champion");
    if (G.bahagian===3 && !p.badges.includes("Problem Solver")) p.badges.push("Problem Solver");
    if (!p.badges.includes("Perfect Score")) p.badges.push("Perfect Score");
  }
  if (p.nyawa===3 && !p.badges.includes("Survivor")) p.badges.push("Survivor");
  if (p.level===3 && !p.badges.includes("Level Master")) p.badges.push("Level Master");
  if (p.rekod.length) {
    const avg = p.rekod.reduce((s,r)=>s+r.masa,0)/p.rekod.length;
    if (avg<5.0 && !p.badges.includes("Speed Genius")) p.badges.push("Speed Genius");
  }
}

// ── Solo end ──
function gameOver() {
  clearTimer();
  saveLeaderboard([{ nama:G.nama, skor:G.skor, bahagian:G.bahagian, badges:G.badges }]);
  render(`
    <div class="gameover-screen">
      <div class="gameover-title">💔 Game Over!</div>
      <div class="gameover-sub">${G.nama}, nyawa anda habis!</div>
      <div style="font-size:18px;font-weight:900;color:var(--teal);margin-bottom:12px;">Skor Akhir: ${G.skor}</div>
      ${badgeSummaryHTML(G.badges)}
      <div class="action-row">
        <button class="action-btn" style="background:#FFB6C1" onclick="showMenu()">🔄 Cuba Lagi</button>
        <button class="action-btn" style="background:#FEF9C3" onclick="showLeaderboard()">🏆 Leaderboard</button>
      </div>
    </div>
  `);
}

function endGame() {
  clearTimer();
  awardBadgesSolo();
  saveLeaderboard([{ nama:G.nama, skor:G.skor, bahagian:G.bahagian, badges:G.badges }]);

  const avg = G.rekod.length ? (G.rekod.reduce((s,r)=>s+r.masa,0)/G.rekod.length).toFixed(1) : "-";
  const lvCfg = LEVEL_CONFIG[G.level];

  render(`
    <div class="result-screen">
      <div class="result-title">🎉 Tamat! 🎉</div>
      <div class="winner-card" style="background:#F0FFF4;border:2px solid #86EFAC;">
        <div class="winner-name">👤 ${G.nama}</div>
        <div class="winner-score">Skor: ${G.skor} / ${SOALAN_MAX}</div>
        <div style="font-size:12px;color:#64748B;margin-top:4px;">
          Bahagian ${G.bahagian}: ${sectionName(G.bahagian)} &nbsp;|&nbsp;
          Nyawa: ${nyawaTeks(G.nyawa)} &nbsp;|&nbsp;
          ⏱ Purata: ${avg}s &nbsp;|&nbsp;
          📈 Level ${G.level} (${lvCfg.nama})
        </div>
      </div>

      ${badgeSummaryHTML(G.badges)}

      <button class="action-btn" style="background:#E0F2FE;margin-bottom:8px;width:100%"
        onclick="showRecords()">📋 Lihat Rekod Jawapan</button>

      <div class="action-row">
        <button class="action-btn" style="background:#DCFCE7" onclick="showMenu()">🏠 Menu Utama</button>
        <button class="action-btn" style="background:#FEF9C3" onclick="showLeaderboard()">🏆 Leaderboard</button>
      </div>
    </div>
  `);
}

function showRecords() {
  const rows = G.rekod.map((r,i)=>`
    <div class="record-item">
      <span class="${r.betul?"rok":"rfail"}">${r.betul?"✔":"❌"}</span>
      <span class="rq"> ${i+1}. ${r.teks}</span><br>
      <span class="rm">Jawapan: ${r.userAns} | Betul: ${r.jawapan} | Masa: ${r.masa?.toFixed(1)||"—"}s</span>
    </div>
  `).join("");
  showModal("📋 Rekod Jawapan", rows || "<p>Tiada rekod.</p>");
}

// ── Multiplayer end turn ──
function endTurn() {
  clearTimer();
  const p = G.pemain[G.pemainIdx];
  awardBadgesMP(p);

  G.pemainIdx++;
  if (G.pemainIdx >= G.pemain.length) {
    saveLeaderboard(G.pemain.map(px=>({ nama:`${px.emoji}${px.nama}`, skor:px.skor, bahagian:G.bahagian, badges:px.badges })));
    showWinner();
  } else {
    showTurnScreen();
  }
}

// ── Winner screen ──
function showWinner() {
  const sorted = [...G.pemain].sort((a,b)=>b.skor-a.skor);
  const winner = sorted[0];
  const medals = ["🥇","🥈","🥉","4️⃣"];

  const rankRows = sorted.map((p,i)=>{
    const origIdx = G.pemain.indexOf(p);
    const badgeIcons = p.badges.map(b=>BADGE_LIST[b]?.icon||"").join("");
    return `<div class="rank-item" style="background:${PLAYER_BG[origIdx%PLAYER_BG.length]}">
      <span class="rank-name">${medals[i]} ${p.emoji} ${p.nama}</span>
      <span class="rank-pts">${p.skor}pts ${nyawaTeks(p.nyawa)} ${badgeIcons}</span>
    </div>`;
  }).join("");

  const tie = sorted.length>1 && sorted[0].skor===sorted[1].skor;

  render(`
    <div class="result-screen">
      <div class="result-title">🏆 Keputusan Akhir!</div>
      <div class="winner-card" style="background:${PLAYER_BORDER[G.pemain.indexOf(winner)%PLAYER_BORDER.length]};color:white;border:none;">
        <div class="winner-label" style="color:white;">🥇 PEMENANG!</div>
        <div class="winner-name" style="color:white;">${winner.emoji} ${winner.nama}</div>
        <div class="winner-score" style="color:rgba(255,255,255,.9);">Skor: ${winner.skor} / ${SOALAN_MAX}</div>
      </div>
      ${tie?`<p style="text-align:center;font-weight:700;color:var(--navy);margin-bottom:8px;">🤝 Seri! Tahniah semua!</p>`:""}
      <div class="rank-list">${rankRows}</div>
      <div class="action-row">
        <button class="action-btn" style="background:#DCFCE7" onclick="showMenu()">🔄 Main Lagi</button>
        <button class="action-btn" style="background:#FEF9C3" onclick="showLeaderboard()">🏆 Leaderboard</button>
      </div>
    </div>
  `);
}

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
G = {};
showMenu();
</script>
